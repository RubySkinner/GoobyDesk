# ==========================================
# GoobyDesk TEMPLATE Core Configuration - DO NOT MODIFY THIS FILE
# ==========================================
# Core Files
core:
  tickets_file: "./prod_data/tickets.json"
  employee_file: "./prod_data/employee.json"
  customer_file: "./prod_data/customers.json"
  serviceid-appid_file: "./prod_data/serviceid.json"

# Logging
logging:
  level: "INFO"         # Valid: DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "/var/log/goobydesk.log" # Relative or absolute path

# Email System
email:
  enabled: false  # true / false - false by default.
  account: ""   # Username/Email Address - Password should be stored in the .env file.
  imap_server: ""
  imap_port: 993
  smtp_server: ""
  smtp_port: 587
  tailscale_notify_email: "tailscale@example.org"

# Discord Support
discord:
  enabled: false  # true / false - false by default.
  webhook_url: ""

# Slack Support
slack:
  enabled: false  # true / false - false by default.
  webhook_url: ""

# Microsoft Teams Support
teams365:
  enabled: false  # true / false - false by default.
  webhook_url: ""
